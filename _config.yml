title: Javae Elliott
description: |
  <p>I’m a graduate researcher and computational social scientist focused on causal inference, machine learning, and computational policy research.</p>

  <p>I currently work as a <strong>Causal Inference Graduate Researcher</strong> at New York University, where I study causal estimation methods, large language models, and applied statistical modeling.</p>

  <p>My projects explore urban accessibility, political rhetoric, algorithmic fairness, public opinion, and educational tools for causal inference through a combination of data science, GIS, NLP, and interactive visualization.</p>

  <p>I recently completed an <strong>M.S. in Applied Statistics for Social Science Research</strong> after earning a <strong>B.A. in Computer Science and Data Science</strong>, both at NYU.</p>

